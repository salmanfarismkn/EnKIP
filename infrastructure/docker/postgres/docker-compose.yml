services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ekp-postgres
    environment:
      POSTGRES_DB: knowledge_platform
      POSTGRES_USER: knowledge_app
      POSTGRES_PASSWORD: knowledge_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U knowledge_app -d knowledge_platform"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: